[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dm_erpnext_integration"
version = "0.0.1"
description = "Integrates Digital Marketplace tenders/briefs with ERPNext"
authors = [
    {name = "CCS Digital Marketplace", email = "support@digitalmarketplace.service.gov.uk"}
]
dependencies = [
    "frappe",
    "requests>=2.25.0"
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Homepage = "https://github.com/alexleach/digitalmarketplace-api"
Repository = "https://github.com/alexleach/digitalmarketplace-api"
